sweep:
  name: ors_2022_open_models_full_fixed_5rep
  game: ro_public_good
  mechanisms:
  - vcm
  - sccm
  - ccm
  prompt_style: paper
  prompt_modifier: none
  reason_style: none
  temperature: 0.7
  seed: 42
  max_tokens: 768
  response_format_mode: json_object
  timeout: 180
  treatments:
  - RESTART
  repetitions: 5
  chains_per_treatment: 4
  generations_per_chain: 60
  players_per_generation: 5
  parallel_players: true
  player_workers: 5
  chain_workers: 4
  show_generation: false
  output_root: outputs/ors_2022_main
  generated_config_dir: outputs/generated_configs
  fixed_player_ablations:
    counts:
    - 1
    - 2
    - 3
    policies:
    - always_cooperate
    - always_free_ride
vllm_defaults:
  host: 127.0.0.1
  port: 8000
  dtype: bfloat16
  max_model_len: 8192
  gpu_memory_utilization: 0.9
  model_snapshot_root: model_snapshots
  vllm_args:
  - --enable-prefix-caching
  - --tensor-parallel-size
  - '2'
  - --disable-custom-all-reduce
